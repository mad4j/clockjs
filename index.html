<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ClockJS</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 4vh 3vw;
      font-family: "Inter", "Aptos", "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #f8fafc, #e8f1f8);
    }
    .clock {
      display: grid;
      place-items: center;
      container-type: inline-size;
      width: min(94vw, 1200px);
      min-height: clamp(16rem, 68vh, 680px);
      padding: clamp(1.5rem, 6vw, 5rem);
      border: 1px solid #dbe5ed;
      border-radius: 24px;
      background: #fff;
      color: #1e293b;
      box-shadow: 0 18px 50px rgba(51,65,85,.12);
      text-align: center;
    }
    #time {
      margin: 0;
      font-size: clamp(2.5rem, 19cqi, 15rem);
      font-weight: 600;
      letter-spacing: .04em;
      font-variant-numeric: tabular-nums;
    }
    .separator { font-size: .62em; }
  </style>
</head>
<body>
  <main class="clock" aria-live="polite">
    <p id="time">--:--:--</p>
  </main>
  <script>
    const time = document.getElementById("time");
    const update = () => {
      const formattedTime = new Date().toLocaleTimeString("it-IT", { hour12: false });
      const fragments = [];
      formattedTime.split(":").forEach((part, index) => {
        if (index > 0) {
          const separator = document.createElement("span");
          separator.className = "separator";
          separator.setAttribute("aria-hidden", "true");
          separator.textContent = ":";
          fragments.push(separator);
        }
        fragments.push(document.createTextNode(part));
      });
      time.replaceChildren(...fragments);
      time.setAttribute("aria-label", formattedTime);
    };
    update();
    setInterval(update, 100);
  </script>
</body>
</html>
